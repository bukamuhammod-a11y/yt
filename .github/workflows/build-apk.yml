name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - "**"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Release Keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            echo "$SECRET_KEYSTORE_B64" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
          else
            AUTO_PASS="bg_yt_release_2026"
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass "$AUTO_PASS" \
              -alias upload \
              -keypass "$AUTO_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=BackgroundYT,O=App,C=US"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$AUTO_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$AUTO_PASS" >> "$GITHUB_ENV"
          fi

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BackgroundYT-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BackgroundYT-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
